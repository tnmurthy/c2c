# Co-located LMS Service for Campus-to-Corporate (C2C)
# Routed seamlessly under https://c2c.mytestbed.tech/lms

version: '3.8'

services:
  moodle-db:
    image: bitnami/postgresql:16
    container_name: c2c-lms-db
    restart: unless-stopped
    environment:
      - POSTGRESQL_USERNAME=moodle_user
      - POSTGRESQL_PASSWORD=moodle_secure_password
      - POSTGRESQL_DATABASE=moodle_c2c
    volumes:
      - moodle_db_data:/bitnami/postgresql
    networks:
      - c2c-lms-net

  moodle:
    image: bitnami/moodle:4.4
    container_name: c2c-lms-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=moodle-db
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_USER=moodle_user
      - MOODLE_DATABASE_PASSWORD=moodle_secure_password
      - MOODLE_DATABASE_NAME=moodle_c2c
      - MOODLE_REVERSEPROXY=yes
      - MOODLE_SSLPROXY=yes
      - MOODLE_URL=https://c2c.mytestbed.tech/lms
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      - moodle-db
    networks:
      - c2c-lms-net

volumes:
  moodle_db_data:
    driver: local
  moodle_data:
    driver: local
  moodledata_data:
    driver: local

networks:
  c2c-lms-net:
    driver: bridge
