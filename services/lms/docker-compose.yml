# Co-located LMS Service for Campus-to-Corporate (C2C)
# Serves Moodle unified under https://c2c.mytestbed.tech/lms

services:
  moodle-db:
    image: postgres:17-alpine
    container_name: c2c-lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle_user
      POSTGRES_PASSWORD: moodle_secure_password
      POSTGRES_DB: moodle_c2c
    volumes:
      - moodle_db_data:/var/lib/postgresql/data
    networks:
      - c2c-lms-net

  moodle:
    image: erseco/alpine-moodle:latest
    container_name: c2c-lms-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Unified URL & Reverse Proxy
      SITE_URL: https://c2c.mytestbed.tech/lms
      REVERSEPROXY: "true"
      SSLPROXY: "true"

      # Dedicated Postgres Database
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: 5432
      DB_NAME: moodle_c2c
      DB_USER: moodle_user
      DB_PASS: moodle_secure_password
      DB_PREFIX: mdl_

      # Site Identity & Default Admin
      MOODLE_SITENAME: C2C_Academy
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: C2cAdmin2026!
      MOODLE_EMAIL: admin@taliatech.in
      MOODLE_LANGUAGE: en

      # PHP Tuning
      client_max_body_size: 100M
      post_max_size: 100M
      upload_max_filesize: 100M
      memory_limit: 512M
      max_input_vars: 5000
    volumes:
      - moodledata_data:/var/www/moodledata
      - moodlehtml_data:/var/www/html
      - ./config.php:/var/www/html/config.php:rw
      - ./nginx-conf/custom.conf:/etc/nginx/server-conf.d/custom.conf:ro
    depends_on:
      - moodle-db
    networks:
      - c2c-lms-net

volumes:
  moodle_db_data:
    driver: local
  moodledata_data:
    driver: local
  moodlehtml_data:
    driver: local

networks:
  c2c-lms-net:
    driver: bridge
